pre-commit:
  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,mjs,mts,json,css,md,yml,yaml}'
      run: pnpm prettier --check {staged_files}
    lint:
      glob: '*.{ts,tsx}'
      run: pnpm eslint {staged_files}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    unit:
      run: pnpm test
